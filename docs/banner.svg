<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WA Rich Export banner — animated preview of an export running in the panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1310"/>
      <stop offset="100%" stop-color="#0e201a"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#1fae82" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1fae82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1fae82"/>
      <stop offset="100%" stop-color="#0a5d45"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1fae82"/>
      <stop offset="100%" stop-color="#dba653"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- Left: wordmark -->
  <g transform="translate(64,0)">
    <rect x="0" y="88" width="34" height="34" rx="9" fill="url(#head)"/>
    <rect x="8" y="100" width="16" height="3.5" rx="1.5" fill="#eef3ee"/>
    <rect x="8" y="108" width="10" height="3.5" rx="1.5" fill="#eef3ee"/>

    <text x="0" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="600" fill="#eef3ee">WA Rich Export</text>
    <text x="2" y="200" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a8b9ae">Every WhatsApp chat, archived offline —</text>
    <text x="2" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a8b9ae">replies, stickers, docs and voice notes intact.</text>

    <g transform="translate(2,250)">
      <rect x="0" y="0" width="230" height="28" rx="14" fill="#10201a" stroke="#23372c"/>
      <circle cx="16" cy="14" r="4" fill="#2fdba9">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="'Courier New', monospace" font-size="12" fill="#a8b9ae">Chrome &amp; Edge · Manifest V3</text>
    </g>
  </g>

  <!-- Right: browser mock — gently bobs, independent of the export cycle below -->
  <g transform="translate(636,44)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -5; 0 0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>

    <rect x="0" y="0" width="500" height="232" rx="14" fill="#10201a" stroke="#23372c"/>
    <rect x="0" y="0" width="500" height="32" rx="14" fill="#16281f"/>
    <rect x="0" y="16" width="500" height="16" fill="#16281f"/>
    <circle cx="20" cy="16" r="5" fill="#33513f"/>
    <circle cx="36" cy="16" r="5" fill="#33513f"/>
    <circle cx="52" cy="16" r="5" fill="#33513f"/>
    <rect x="90" y="7" width="180" height="18" rx="9" fill="#0a1310" stroke="#23372c"/>
    <text x="180" y="20" font-family="'Courier New', monospace" font-size="10.5" fill="#75887d" text-anchor="middle">web.whatsapp.com</text>

    <!-- chat bubbles -->
    <rect x="22" y="54" width="230" height="30" rx="9" fill="#14241d" stroke="#23372c"/>
    <text x="34" y="73" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c7d3cc">Can you resend the voice note?</text>

    <rect x="130" y="94" width="230" height="46" rx="9" fill="#143026" stroke="#2c4b3d"/>
    <rect x="142" y="102" width="150" height="10" rx="2" fill="#1fae82" opacity="0.35"/>
    <text x="142" y="126" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#dcefe5">Sending the export now 🎙️</text>

    <rect x="22" y="150" width="180" height="30" rx="9" fill="#14241d" stroke="#23372c"/>
    <text x="34" y="169" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c7d3cc">Perfect, thank you!</text>

    <!-- download chip — slides/fades in only once the export finishes each cycle -->
    <g transform="translate(22,150)">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
        keyTimes="0;0.88;0.94;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" dur="7s" repeatCount="indefinite"
        keyTimes="0;0.88;0.94;1" values="0 10;0 10;0 0;0 0"/>
      <rect x="0" y="0" width="180" height="30" rx="9" fill="#143026" stroke="#2fdba9"/>
      <circle cx="18" cy="15" r="8" fill="#1fae82"/>
      <path d="M14 15l3 3 6-6" stroke="#eef3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="19" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dcefe5">sundarbans-export.zip</text>
    </g>

    <!-- floating export panel -->
    <g transform="translate(300,36)">
      <rect x="0" y="0" width="178" height="120" rx="11" fill="#0e2019" stroke="#2c4436"/>
      <path d="M0 11 a11 11 0 0 1 11 -11 h156 a11 11 0 0 1 11 11 v17 h-178 Z" fill="url(#head)"/>
      <text x="10" y="18" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#f2fbf7">WA Rich Export</text>
      <circle cx="163" cy="14" r="3.5" fill="#7fd7e0">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>

      <!-- step dots: pending -> active -> done, timed against the shared 7s export cycle -->
      <line x1="18" y1="40" x2="129" y2="40" stroke="#23372c" stroke-width="1"/>
      <circle cx="18" cy="40" r="3.5" fill="#33513f">
        <animate attributeName="fill" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.08;0.30;1" values="#33513f;#1fae82;#2fdba9;#2fdba9"/>
        <animate attributeName="r" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.08;0.20;0.30;1" values="3.5;4.3;4.3;3.5;3.5"/>
      </circle>
      <circle cx="55" cy="40" r="3.5" fill="#33513f">
        <animate attributeName="fill" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.30;0.45;1" values="#33513f;#1fae82;#2fdba9;#2fdba9"/>
        <animate attributeName="r" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.30;0.38;0.45;1" values="3.5;4.3;4.3;3.5;3.5"/>
      </circle>
      <circle cx="92" cy="40" r="3.5" fill="#33513f">
        <animate attributeName="fill" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.45;0.75;1" values="#33513f;#1fae82;#2fdba9;#2fdba9"/>
        <animate attributeName="r" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.45;0.60;0.75;1" values="3.5;4.3;4.3;3.5;3.5"/>
      </circle>
      <circle cx="129" cy="40" r="3.5" fill="#33513f">
        <animate attributeName="fill" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.75;0.90;1" values="#33513f;#1fae82;#2fdba9;#2fdba9"/>
        <animate attributeName="r" calcMode="discrete" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.75;0.83;0.90;1" values="3.5;4.3;4.3;3.5;3.5"/>
      </circle>

      <rect x="14" y="54" width="150" height="7" rx="3.5" fill="#16281f"/>
      <rect x="14" y="54" width="6" height="7" rx="3.5" fill="url(#bar)">
        <animate attributeName="width" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.08;0.30;0.45;0.75;0.90;1" values="6;6;62;83;128;150;150"/>
      </rect>

      <!-- status line: six phases cross-fading in place, matching the real panel's own copy.
           calcMode="discrete" is required here — without it, opacity interpolates linearly
           between keyframes and two phases' text visibly overlaps mid-transition. -->
      <g font-family="Arial, Helvetica, sans-serif" font-size="9.5">
        <text x="14" y="78" fill="#a8b9ae">
          <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.08;1" values="1;0;0"/>
          Ready to export.
        </text>
        <text x="14" y="78" fill="#a8b9ae">
          <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.08;0.30;1" values="0;1;0;0"/>
          Loading history… 640/842
        </text>
        <text x="14" y="78" fill="#a8b9ae">
          <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.30;0.45;1" values="0;1;0;0"/>
          Structuring messages…
        </text>
        <text x="14" y="78" fill="#a8b9ae">
          <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.45;0.75;1" values="0;1;0;0"/>
          Downloading media… 214/240
        </text>
        <text x="14" y="78" fill="#a8b9ae">
          <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.75;0.90;1" values="0;1;0;0"/>
          Building ZIP archive…
        </text>
        <text x="14" y="78" fill="#4fe0b8" font-weight="700">
          <animate attributeName="opacity" calcMode="discrete" dur="7s" repeatCount="indefinite" keyTimes="0;0.90;1" values="0;1;1"/>
          ✓ 842 messages saved
        </text>
      </g>

      <rect x="14" y="90" width="150" height="18" rx="5" fill="#143026">
        <animate attributeName="fill" dur="7s" repeatCount="indefinite"
          keyTimes="0;0.02;0.07;1" values="#143026;#1c4536;#143026;#143026"/>
      </rect>
      <text x="89" y="102.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#4fe0b8" text-anchor="middle">Export chat</text>

      <!-- cursor: arrives, clicks Export chat, then fades until the next cycle -->
      <g>
        <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.005;0.07;0.09;1" values="0;1;1;0;0"/>
        <circle cx="89" cy="99" r="7" fill="none" stroke="#4fe0b8" stroke-width="1.4">
          <animate attributeName="r" dur="7s" repeatCount="indefinite" keyTimes="0;0.02;0.07;1" values="4;10;4;4"/>
          <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.02;0.07;1" values="0.9;0;0.9;0.9"/>
        </circle>
        <path d="M85 92 L85 104 L88.5 101 L90.5 105.5 L92.5 104.6 L90.5 100.4 L94.5 100.1 Z" fill="#eef3ee" stroke="#0e2019" stroke-width="0.8"/>
      </g>
    </g>
  </g>
</svg>
